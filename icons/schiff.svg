<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 124" width="240" height="124">
  <!-- Comic-Kreuzfahrtschiff, schaut nach rechts. Eigenes Design, kein Markenlogo. -->
  <g stroke="#2a2118" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Schornstein -->
    <path d="M86 30 L90 8 Q91 4 96 4 L112 4 Q117 4 116 9 L112 30 Z" fill="#ffffff"/>
    <path d="M89 16 L114 16 L113 22 L88 22 Z" fill="#e2483d" stroke-width="2"/>
    <!-- Brücke / oberstes Deck -->
    <path d="M70 34 L70 26 Q70 22 74 22 L170 22 Q178 22 182 30 L184 34 Z" fill="#ffffff"/>
    <!-- Deck 2 -->
    <path d="M44 48 L44 38 Q44 34 48 34 L188 34 Q196 34 200 42 L203 48 Z" fill="#ffffff"/>
    <!-- Deck 1 -->
    <path d="M24 64 L24 52 Q24 48 28 48 L206 48 Q215 48 219 56 L223 64 Z" fill="#ffffff"/>
    <!-- Rumpf -->
    <path d="M12 64 L230 62 Q237 62 235 68 L218 100 Q215 106 206 106 L36 106 Q26 106 22 98 Z" fill="#1f4fa3"/>
    <!-- Wasserlinie -->
    <path d="M26 100 L216 100 Q214 106 206 106 L36 106 Q29 106 26 100 Z" fill="#e2483d" stroke-width="2"/>
    <!-- Rettungsboote -->
    <rect x="52" y="56" width="22" height="9" rx="4.5" fill="#ff9f1c" stroke-width="2"/>
    <rect x="86" y="56" width="22" height="9" rx="4.5" fill="#ff9f1c" stroke-width="2"/>
    <rect x="120" y="56" width="22" height="9" rx="4.5" fill="#ff9f1c" stroke-width="2"/>
    <rect x="154" y="56" width="22" height="9" rx="4.5" fill="#ff9f1c" stroke-width="2"/>
  </g>
  <!-- Fensterbänder -->
  <g fill="#7fd3e6" stroke="#2a2118" stroke-width="1.5">
    <rect x="166" y="25" width="14" height="6" rx="2"/>
    <rect x="78" y="26" width="80" height="5" rx="2.5"/>
    <rect x="52" y="38" width="136" height="6" rx="3"/>
    <rect x="32" y="51" width="176" height="3.5" rx="1.75"/>
  </g>
  <!-- Bullaugen im Rumpf -->
  <g fill="#ffffff" stroke="#2a2118" stroke-width="1.5">
    <circle cx="44" cy="80" r="3.2"/><circle cx="62" cy="80" r="3.2"/><circle cx="80" cy="80" r="3.2"/>
    <circle cx="98" cy="80" r="3.2"/><circle cx="116" cy="80" r="3.2"/><circle cx="134" cy="80" r="3.2"/>
    <circle cx="152" cy="80" r="3.2"/><circle cx="170" cy="80" r="3.2"/><circle cx="188" cy="80" r="3.2"/>
  </g>
  <!-- Glanzlicht und Bug-Welle -->
  <path d="M40 70 L210 68" stroke="#ffffff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M214 104 q8 -6 16 0 q6 4 12 0" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Fähnchen -->
  <path d="M30 48 L30 32" stroke="#2a2118" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M30 32 L44 36 L30 40 Z" fill="#ffd23f" stroke="#2a2118" stroke-width="2" stroke-linejoin="round"/>
</svg>
