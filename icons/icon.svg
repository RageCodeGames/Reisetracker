<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Comic-Weltkugel mit Schiff">
  <!-- Quadratisch vollflchig, damit maskable und Apple-Icon deckend bleiben. -->
