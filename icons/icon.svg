    <circle cx="178" cy="318" r="10" fill="none" stroke="#fffef8" stroke-width="4" opacity="0.8"/>
    <circle cx="178" cy="318" r="4" fill="none" stroke="#fffef8" stroke-width="3" opacity="0.8"/>
  </g>

  <!-- Kleines Kreuzfahrtschiff davor, ohne echte Logos -->
