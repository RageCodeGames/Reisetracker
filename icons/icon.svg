      d="M168 168
         c18 -38 58 -48 92 -38
         c28 8 48 28 46 54
         c-4 28 -28 40 -54 46
         c-36 8 -72 -8 -92 -28
         c-12 -12 -10 -22 8 -34z"/>
    <path fill="#b7d98a" stroke-width="8"
      d="M214 248
