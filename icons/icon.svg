  <!-- Weltkugel -->
  <g stroke="#1a1208" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="256" cy="228" r="164" fill="#1ab8cc" stroke-width="14"/>

    <!-- Comic-Kontinente, sandgelb und hellgrn -->
