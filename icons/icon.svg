    <circle cx="10" cy="6" r="3.2" fill="#d7f1f6" stroke-width="1.7"/>
    <circle cx="24" cy="6" r="3.2" fill="#d7f1f6" stroke-width="1.7"/>
    <circle cx="8" cy="-44" r="8" fill="#f2d48a" stroke-width="2.3"/>
    <rect x="1" y="-47" width="14" height="5" rx="1.5" fill="#1d4e8f" stroke="none"/>
